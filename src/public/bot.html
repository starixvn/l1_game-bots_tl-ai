    <div id="wrapper">
      <img class="table-bg" src="img/tienlen_table.png" alt="bg" />
      <div id="doithu">
        <button
          hidden="hidden"
          type="button"
          id="khl"
          class="btn btn-primary"
          data-toggle="modal"
          data-target="#myModal"
        >
          1
        </button>
      </div>
      <div id="listMessages"></div>
      <div id="history2"></div>
      <span id="mm0">M0</span>
      <span id="mm1">M1</span>
      <span id="mm2">M2</span>
      <span id="mm3">M3</span>
      <div id="bot0"></div>
      <div id="bot1"></div>
      <div id="bot2"></div>
      <div id="bot3"></div>
      <button
        hidden="hidden"
        type="button"
        class="btn btn-success"
        id="btnSendMessage2"
        value="danh"
        style="display: none"
      ></button>
      <button
        hidden="hidden"
        type="button"
        class="btn btn-danger"
        id="btnboluot2"
        value="bo luot"
        style="display: none"
      ></button>
      <button
        type="button"
        class="btn btn-danger"
        id="btnboluot"
        value="bo luot"
        hidden
      >
        Bỏ qua
      </button>
      <button
        type="button"
        class="btn btn-success"
        id="btnSendMessage"
        value="danh"
        hidden
      >
        Đánh
      </button>

      <button type="button" class="btn btn-danger" id="btnbatdau">Start</button>
      <div class="action-end-round">
        <button type="button" class="btn btn-danger" id="btntieptuc">
          Continue
        </button>
      </div>

      <button
        type="button"
        class="btn btn-download"
        data-toggle="modal"
        data-target="#downloadModal"
      >
        Download Logs
      </button>

      <div class="speed">
        <span><b>Speed</b></span>
        <div class="ml-5">
          <input type="radio" name="speed" value="2000" id="speed-slow" />
          <label for="speed-slow" style="width: 80px">Slow</label>
          <input
            type="radio"
            name="speed"
            value="1000"
            id="speed-normal"
            checked
          />
          <label for="speed-normal" style="width: 80px">Normal</label>

          <input type="radio" name="speed" value="500" id="speed-fast" />
          <label for="speed-fast" style="width: 80px">Fast</label>
          <input type="radio" name="speed" value="100" id="speed-super-fast" />
          <label for="speed-super-fast">Super Fast</label>
        </div>
      </div>
      <button
        type="button"
        class="btn btn-setting"
        data-toggle="modal"
        data-target="#settingModal"
      >
        Setting
      </button>
    </div>
    <!-- The Modal -->
    <div class="modal" id="myModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <!-- Modal Header -->
          <div class="modal-header">
            <h4 class="modal-title">Bài đánh không hợp lệ</h4>
            <button type="button" class="close" data-dismiss="modal">
              &times;
            </button>
          </div>
        </div>
      </div>
    </div>
    <div
      class="modal fade"
      id="downloadModal"
      tabindex="-1"
      role="dialog"
      aria-labelledby="downloadModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="downloadModalLabel">Download logs</h5>
            <button
              type="button"
              class="close"
              data-dismiss="modal"
              aria-label="Close"
            >
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <label for="inputDownloadLimit">Top Round</label>
              <input
                type="number"
                class="form-control"
                id="inputDownloadLimit"
                value="100"
              />
            </div>
            <div class="form-group">
              <label for="inputDownloadLimit">Code</label>
              <input type="text" class="form-control" id="inputDownloadCode" />
            </div>
            <button type="submit" class="btn btn-primary" id="download">
              Download
            </button>
          </div>
        </div>
      </div>
    </div>
    <div
      class="modal fade"
      id="settingModal"
      tabindex="-1"
      role="dialog"
      aria-labelledby="settingModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="settingModalLabel">Setting</h5>
            <button
              type="button"
              class="close"
              data-dismiss="modal"
              aria-label="Close"
            >
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <div class="form-group row">
              <label for="limitRound" class="col-5 col-form-label"
                >Limit Round</label
              >
              <div class="col-5">
                <input
                  type="number"
                  class="form-control"
                  id="limitRound"
                  value="10"
                />
              </div>
            </div>
            <div class="form-group row">
              <label for="autoContinue" class="col-5 col-form-label"
                >Auto Continue</label
              >
              <div class="col-5">
                <input
                  type="checkbox"
                  id="autoContinue"
                  class="form-check-label mt-2"
                  style="width: 20px; height: 20px"
                />
              </div>
            </div>
            <div class="form-group row">
              <label class="col-5 col-form-label">Number bots</label>
              <div class="col-7 mt-2">
                <input
                  type="radio"
                  name="numberBot"
                  id="numberBot2"
                  value="2"
                />
                <label for="numberBot2" style="width: 50px">2</label>
                <input
                  type="radio"
                  name="numberBot"
                  id="numberBot3"
                  value="3"
                />
                <label for="numberBot3" style="width: 50px">3</label>
                <input
                  type="radio"
                  name="numberBot"
                  id="numberBot4"
                  value="4"
                  checked
                />
                <label for="numberBot4" style="width: 50px">4</label>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>
    <label class="code">
      <span>Code</span>
      <input type="text" id="inputCode" />
    </label>
    <button class="btn btn-primary" id="showHideLog">Show/Hide Logs</button>
